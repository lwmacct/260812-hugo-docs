# Taskfile.yml
# https://taskfile.dev
# To enable experimental features
# export TASK_X_FEATURE=1
# export TASK_X_REMOTE_TASKFILES=1
# https://taskfile.dev/docs/experiments/remote-taskfiles

version: "3"
dotenv: [".env", ".env.example", "{{.HOME}}/.env"]

vars:
  TASK_REMOTE: "github.com/lwmacct/251207-task-remote.git/"

includes:
  env:
    taskfile: https://{{.TASK_REMOTE}}/.task/env.yml?ref=main
    optional: true
    flatten: true

  git:
    taskfile: https://{{.TASK_REMOTE}}/.task/git.yml?ref=main
    optional: true

  ci:
    taskfile: .task/ci.yml
    optional: true

tasks:
  dev:
    desc: Start the Hugo development server
    cmds:
      - hugo server --buildDrafts --disableFastRender

  build:
    desc: Build an optimized production site
    cmds:
      - hugo --gc --minify

  check:
    desc: Validate Hugo configuration and content
    cmds:
      - hugo --printPathWarnings --quiet
